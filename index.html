    <!-- WhatsApp / Facebook link preview — Hindi mein, kisaano ke liye -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="दूध ट्रैकर" />
    <meta property="og:title" content="🥛 दूध ट्रैकर — दूध का हिसाब, अपने फ़ोन में" />
    <meta property="og:description" content="गाय और भैंस का दूध हिसाब — सुबह-शाम, रेट, FAT से पैसा, महीने की रिपोर्ट, PDF और WhatsApp पर्ची। बिना इंटरनेट भी चलता है।" />
    <meta property="og:image" content="https://raw.githubusercontent.com/doodhtracker/doodhtracker.github.io/main/logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="🥛 दूध ट्रैकर — दूध का हिसाब, अपने फ़ोन में" />
    <meta name="twitter:description" content="गाय और भैंस का दूध हिसाब — सुबह-शाम, रेट, FAT, रिपोर्ट और PDF। बिना इंटरनेट भी चलता है।" />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/doodhtracker/doodhtracker.github.io/main/logo.png" />

    <title>🥛 Doodh Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker — offline ke liye.
      // Naya version aane par page KHUD reload NAHI hota (warna user ki
      // aadhi likhi entry ud jati). Neeche ek chhota button aata hai —
      // user apna kaam save karke khud refresh karta hai.
      if ('serviceWorker' in navigator) {
        var bannerShown = false

        function showUpdateBanner() {
          if (bannerShown) return
          bannerShown = true
          var bar = document.createElement('div')
          bar.style.cssText =
            'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;' +
            'background:#065f46;color:#fff;border:1px solid #10b981;border-radius:12px;' +
            'padding:12px 14px;display:flex;align-items:center;gap:10px;' +
            'box-shadow:0 8px 24px rgba(0,0,0,.45);font-family:system-ui,sans-serif;font-size:15px'
          var msg = document.createElement('span')
          msg.style.flex = '1'
          msg.textContent = '🔄 नया अपडेट आया है'
          var btn = document.createElement('button')
          btn.textContent = 'रिफ्रेश करें'
          btn.style.cssText =
            'background:#f59e0b;color:#052e22;border:0;border-radius:8px;' +
            'padding:9px 14px;font-weight:700;font-size:15px'
          btn.onclick = function () {
            window.location.reload()
          }
          bar.appendChild(msg)
          bar.appendChild(btn)
          document.body.appendChild(bar)
        }

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          showUpdateBanner()
        })

        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              reg.update()
            })
            .catch(function (err) {
              console.warn('Service worker register nahi hua:', err)
            })
        })
      }
    </script>
  </body>
</html>
